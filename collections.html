<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections — dryrobe®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="page-section" style="padding-top:7.5rem;">
    <div class="wrap">
      <div class="section-head reveal" style="border-bottom:none;">
        <div><h2 class="font-archivo">Collections</h2><p class="sub">Five lines, five moods — one brand underneath.</p></div>
      </div>
      <div class="collections-page-grid" id="collections-grid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="icons.js"></script>
<script src="products-data.js"></script>
<script src="cart.js"></script>
<script src="layout.js"></script>
<script>
(function () {
  "use strict";
  const IMG_MAP = {
    "reign": "product-hoodie.jpg",
    "after-dark": "hero.jpg",
    "urban-form": "collection-1.jpg",
    "summer-motion": "collection-3.jpg",
    "future-classics": "collection-2.jpg"
  };
  const grid = document.getElementById("collections-grid");
  COLLECTIONS_META.forEach((c, i) => {
    const count = getByCollection(c.slug).length;
    const el = document.createElement("a");
    el.href = "shop.html?collection=" + c.slug;
    el.className = "collection-hero-card reveal" + (i === 0 ? " full" : "");
    el.innerHTML =
      '<img src="' + IMG_MAP[c.slug] + '" alt="' + c.name + '">' +
      '<div class="ch-content"><span class="eyebrow">' + count + ' pieces</span><h3 class="font-archivo">' + c.name + '</h3><p>' + c.tagline + '</p></div>';
    grid.appendChild(el);
  });

  window.addEventListener("load", () => { initScrollReveal(); initMagnetic(); });
})();
</script>
</body>
</html>
